<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pieGradient" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE1E6"/>
      <stop offset="0.45" stop-color="#3AA8FF"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>

    <linearGradient id="sliceGradient" x1="34" y1="10" x2="54" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#35C9FF"/>
    </linearGradient>
  </defs>

  <!-- Main pie structure -->
  <path
    d="M32 7
       A25 25 0 1 0 57 32
       H32 Z"
    fill="url(#pieGradient)"
  />

  <!-- Structural divisions -->
  <path
    d="M32 7V32H57
       M32 32L14.3 49.7
       M32 32L14.3 14.3"
    fill="none"
    stroke="#07111D"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Raised pie slice -->
  <path
    d="M32 7
       A25 25 0 0 1 57 32
       H32 Z"
    fill="url(#sliceGradient)"
    stroke="#07111D"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Central structural node -->
  <circle
    cx="32"
    cy="32"
    r="5"
    fill="#07111D"
  />

  <circle
    cx="32"
    cy="32"
    r="2"
    fill="#5CE1E6"
  />
</svg>